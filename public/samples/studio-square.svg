<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#0e2219" />
      <stop offset="1" stop-color="#2f6049" />
    </linearGradient>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" />
    </pattern>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)" />
  <rect width="1200" height="1200" fill="url(#grid)" />
  <rect x="10" y="10" width="1180" height="1180" fill="none" stroke="#d6e9c4" stroke-opacity="0.45"
    stroke-width="4" />

  <g stroke="#d6e9c4" stroke-opacity="0.32" stroke-width="3" stroke-dasharray="14 12">
    <path d="M0 300H1200M0 600H1200M0 900H1200M300 0V1200M600 0V1200M900 0V1200" />
  </g>
  <g fill="#d6e9c4" fill-opacity="0.75" font-family="system-ui, sans-serif" font-size="28"
    font-weight="600" letter-spacing="3">
    <text x="30" y="290">25%</text>
    <text x="30" y="590">50%</text>
    <text x="30" y="890">75%</text>
  </g>

  <g fill="#d6e9c4" font-family="system-ui, sans-serif" font-size="46" font-weight="700"
    letter-spacing="12">
    <text x="600" y="110" text-anchor="middle">TOP EDGE</text>
    <text x="600" y="1140" text-anchor="middle">BOTTOM EDGE</text>
    <text x="40" y="615" text-anchor="start" font-size="34">LEFT</text>
    <text x="1160" y="615" text-anchor="end" font-size="34">RIGHT</text>
  </g>

  <g transform="translate(600 600)">
    <circle r="54" fill="none" stroke="#d6e9c4" stroke-width="5" />
    <path d="M-86 0H-26M26 0H86M0 -86V-26M0 26V86" stroke="#d6e9c4" stroke-width="5" />
    <text y="128" fill="#d6e9c4" font-family="system-ui, sans-serif" font-size="26"
      font-weight="600" letter-spacing="8" text-anchor="middle">FOCAL POINT</text>
  </g>

  <g fill="#ffffff" font-family="system-ui, sans-serif" font-size="30" font-weight="600"
    letter-spacing="4">
    <text x="40" y="1010" fill-opacity="0.95">Studio square</text>
    <text x="40" y="1053" fill-opacity="0.55">1200 &#215; 1200</text>
  </g>
</svg>
